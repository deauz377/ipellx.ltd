services:
  - type: web
    name: ipellx-erp
    runtime: python
    plan: starter          # a paid plan is required for the persistent disk below
    buildCommand: ./build.sh
    startCommand: gunicorn realkukuERP_System.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    healthCheckPath: /login/
    disk:
      # HR resumes and payroll receipts are written here; without a disk they
      # disappear on every redeploy.
      name: media
      mountPath: /var/data/media
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: DATABASE_URL
        fromDatabase:
          name: ipellx-erp-db
          property: connectionString

databases:
  - name: ipellx-erp-db
    plan: basic-256mb
    databaseName: ipellx_erp
    user: ipellx
