<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify your iPellX account</title>
</head>
<body style="margin:0; padding:0; background-color:#F5F7FA; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F7FA; padding:32px 16px;">
<tr>
<td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#FFFFFF; border-radius:12px; overflow:hidden; border:1px solid #E2E6EB;">
<tr>
<td style="background:linear-gradient(165deg,#1E3A5F,#2C5F8D); padding:28px 32px;">
<span style="font-size:1.2rem; font-weight:700; color:#FFFFFF; letter-spacing:-0.01em;">&#9679; IPELLX</span>
</td>
</tr>
<tr>
<td style="padding:32px;">
<h1 style="margin:0 0 16px; font-size:1.3rem; font-weight:700; color:#1B2531;">Welcome to iPellX.</h1>
<p style="margin:0 0 20px; font-size:0.95rem; line-height:1.6; color:#4B5768;">
Please verify your email address to activate your account.
</p>
<table role="presentation" cellpadding="0" cellspacing="0">
<tr>
<td style="border-radius:8px; background-color:#1E3A5F;">
<a href="{{ verify_url }}" style="display:inline-block; padding:12px 28px; font-size:0.95rem; font-weight:600; color:#FFFFFF; text-decoration:none;">Verify My Email</a>
</td>
</tr>
</table>
<p style="margin:24px 0 0; font-size:0.8rem; line-height:1.5; color:#8A94A3;">
If the button doesn't work, copy and paste this link into your browser:<br>
<a href="{{ verify_url }}" style="color:#2C5F8D; word-break:break-all;">{{ verify_url }}</a>
</p>
<p style="margin:24px 0 0; font-size:0.8rem; line-height:1.5; color:#8A94A3;">
If you did not create this account, you can safely ignore this email.
</p>
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
