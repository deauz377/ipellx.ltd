<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1FD4B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Stylized "i" logo -->
  <g id="i-icon">
    <!-- Top blue circle -->
    <circle cx="90" cy="70" r="45" fill="#0052CC"/>
    
    <!-- Curved blue section -->
    <path d="M 50 130 Q 50 160 75 180 L 90 250 Q 95 280 95 320 Q 95 350 85 360 L 60 365 Q 40 360 40 330 L 40 160 Q 40 130 50 130" fill="#0066FF"/>
    
    <!-- Curved teal section -->
    <path d="M 95 180 Q 120 160 140 150 L 130 320 Q 130 360 105 370 L 85 360 L 90 250 Q 95 220 95 180" fill="#1FD4B8"/>
  </g>
  
  <!-- "Pell" text -->
  <text x="280" y="300" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="900" fill="#1a2634">Pell</text>
  
  <!-- Teal accent in "e" -->
  <g id="accent">
    <polygon points="490,280 520,260 530,290 510,300" fill="#1FD4B8"/>
  </g>
  
  <!-- Blue accent line -->
  <line x1="180" y1="380" x2="260" y2="380" stroke="#0052CC" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Green accent line -->
  <line x1="520" y1="380" x2="600" y2="380" stroke="#1FD4B8" stroke-width="8" stroke-linecap="round"/>
</svg>