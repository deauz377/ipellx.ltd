{% extends 'base.html' %}
{% block title %}New Savings Goal - 14xlevel ERP{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="bi bi-piggy-bank"></i> New Savings Goal</h1>
    <a href="{% url 'accounting:savings_goal_list' %}" class="btn btn-outline-secondary">Back</a>
</div>

<div class="card" style="max-width: 500px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Goal Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. New Fridge, Rent Buffer, Emergency Fund" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Target Amount (optional)</label>
                <input type="number" step="0.01" name="target_amount" class="form-control" placeholder="Leave blank if open-ended">
            </div>
            <div class="mb-3">
                <label class="form-label">Notes (optional)</label>
                <textarea name="notes" class="form-control" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Create Goal</button>
        </form>
    </div>
</div>
{% endblock %}
