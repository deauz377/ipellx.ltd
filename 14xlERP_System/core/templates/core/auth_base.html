<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}14xlevel ERP{% endblock %}</title>
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #1E3A5F;
            --primary: #2C5F8D;
            --primary-light: #3D7BA8;
            --bg-primary: #F5F7FA;
            --bg-secondary: #FFFFFF;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
            --border: #E0E4E8;
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --primary-dark: #14283F;
            --primary: #2C5F8D;
            --primary-light: #3D7BA8;
            --bg-primary: #12161C;
            --bg-secondary: #1B212B;
            --text-primary: #E5E7EB;
            --text-secondary: #9CA3AF;
            --border: #2C3440;
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.5);
        }

        body {
            background-color: var(--bg-primary);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            padding: 40px 32px;
        }

        .auth-brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-brand i {
            font-size: 2rem;
            color: var(--primary);
        }

        .auth-brand h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-top: 8px;
            margin-bottom: 0;
        }

        .auth-card p.auth-subtext {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .auth-card label {
            font-weight: 500;
            font-size: 0.875rem;
            margin-bottom: 6px;
            display: block;
        }

        .auth-card input[type="text"],
        .auth-card input[type="email"],
        .auth-card input[type="password"],
        .auth-card select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin-bottom: 18px;
        }

        .auth-card input:focus,
        .auth-card select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .auth-btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 6px;
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .auth-btn:hover {
            background-color: var(--primary-dark);
        }

        .auth-errors {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #B91C1C;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.875rem;
            margin-bottom: 18px;
        }

        [data-theme="dark"] .auth-errors {
            color: #FCA5A5;
        }

        .auth-links {
            text-align: center;
            margin-top: 18px;
            font-size: 0.875rem;
        }

        .auth-links a {
            color: var(--primary-light);
            text-decoration: none;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        .theme-toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button type="button" id="themeToggleBtn" class="theme-toggle-btn" title="Toggle dark mode">
        <i class="bi bi-moon-stars" id="themeToggleIcon"></i>
    </button>

    <div class="auth-card">
        <div class="auth-brand">
            <i class="bi bi-graph-up"></i>
            <h1>14xlevel ERP</h1>
        </div>

        {% block auth_content %}{% endblock %}
    </div>

    <script>
        (function () {
            var htmlEl = document.documentElement;
            var toggleBtn = document.getElementById('themeToggleBtn');
            var toggleIcon = document.getElementById('themeToggleIcon');

            function updateIcon() {
                var isDark = htmlEl.getAttribute('data-theme') === 'dark';
                toggleIcon.className = isDark ? 'bi bi-sun' : 'bi bi-moon-stars';
            }

            updateIcon();

            toggleBtn.addEventListener('click', function () {
                var isDark = htmlEl.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    htmlEl.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                } else {
                    htmlEl.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                }
                updateIcon();
            });
        })();
    </script>
</body>
</html>
