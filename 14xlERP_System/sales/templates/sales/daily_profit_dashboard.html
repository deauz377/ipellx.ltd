{% extends "base.html" %}

{% block content %}
  <h1>Daily Profit Dashboard</h1>
  <form method="get">
    <label for="date">Date (YYYY-MM-DD):</label>
    <input type="text" name="date" id="date" value="{{ result.date }}">
    <button type="submit">Show</button>
  </form>

  <table>
    <tr><th>Revenue</th><td>{{ result.revenue }}</td></tr>
    <tr><th>Cost</th><td>{{ result.cost }}</td></tr>
    <tr><th>Gross profit</th><td>{{ result.gross_profit }}</td></tr>
    <tr><th>Expenses</th><td>{{ result.expenses }}</td></tr>
    <tr><th>Net profit</th><td>{{ result.net_profit }}</td></tr>
  </table>

{% endblock %}
