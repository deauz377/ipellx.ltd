{% extends 'base.html' %}

{% block title %}Delete Salary Structure - 14xlevel ERP{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px;">
    <div class="card-body">
        <h4>Delete Salary Structure?</h4>
        <p>Are you sure you want to delete <strong>{{ object }}</strong>? This can't be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{% url 'payroll:structure_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
