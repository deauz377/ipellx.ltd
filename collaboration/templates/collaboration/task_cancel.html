{% extends 'base.html' %}
{% block title %}Cancel task - 14xlevel ERP{% endblock %}
{% block content %}
<div class="mb-4"><h1><i class="bi bi-x-circle"></i> Cancel task</h1></div>
<div class="card" style="max-width:560px;">
    <div class="card-body">
        <p>Cancel <strong>"{{ task.title }}"</strong>, assigned to {{ task.assigned_to.username }}?</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Reason (optional)</label>
                <input type="text" name="cancel_reason" class="form-control" placeholder="Why is this being cancelled?">
            </div>
            <button type="submit" class="btn btn-danger">Cancel task</button>
            <a href="{% url 'collaboration:task_list' %}" class="btn btn-secondary">Keep it</a>
        </form>
    </div>
</div>
{% endblock %}
