{% extends 'base.html' %}
{% block title %}Complete task - 14xlevel ERP{% endblock %}
{% block content %}
<div class="mb-4"><h1><i class="bi bi-check2-circle"></i> Mark task done</h1></div>
<div class="card" style="max-width:560px;">
    <div class="card-body">
        <p><strong>{{ task.title }}</strong></p>
        {% if task.description %}<p class="text-muted">{{ task.description }}</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="{{ form.completion_note.id_for_label }}" class="form-label">{{ form.completion_note.label }}</label>
                {{ form.completion_note }}
            </div>
            <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> Mark done</button>
            <a href="{% url 'collaboration:my_work' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
